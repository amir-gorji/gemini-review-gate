# The review as a job inside an existing CI workflow, for repositories whose
# required status is one aggregate job (an `all` with `if: always()` that
# reads every needs.*.result), or whose plan has no rulesets to require a
# second check with. Paste the job into that workflow and add `gemini-review`
# to the aggregate's `needs` and to its result loop.
#
# The workflow-level `permissions` are usually `contents: read`; the job
# overrides them for the PR comment.

  gemini-review:
    name: Gemini review
    # Pull requests only: a push-to-main run re-validates a diff the review
    # already saw, and there is no PR to comment on. Dependabot PRs are
    # skipped because a dependabot-triggered run reads the Dependabot secret
    # store, not the Actions one, so the key would be empty and the check red
    # on every batch; add the key to that store instead if you want them
    # reviewed. An aggregate that counts `skipped` as passing is unaffected.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: amir-gorji/gemini-review-gate@<sha> # v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          system: a TypeScript service that does X for Y
          policy-file: .github/gemini-review-policy.md
          exclude: |
            pnpm-lock.yaml
            **/*.generated.*
            .github/gemini-review-calibration/**

